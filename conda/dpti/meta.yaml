{% set name = "dpti" %}
{% set version = os.popen('git describe --tags --abbrev=0').read().strip('\n').lstrip('v').replace('-', '_') %}

package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  path: ../../

build:
  number: 0
  noarch: python
  script: python -m pip install --no-deps --ignore-installed .

requirements:
  build:
    - git
  host:
    - python >=3.10
    - pip
    - setuptools
    - setuptools_scm
    - wheel

  run:
    - python >=3.10
    - apache-airflow >=2.0
    - scipy
    - numpy
    - pymbar
    - dargs
    - paramiko
    - dpdispatcher >=0.3
    - sqlalchemy >=1.4.28,<2.0

test:
  imports:
    - dpti
  commands:
    - python -c "import dpti.ti; import dpti.dags.dp_ti_gdi"

about:
  home: https://github.com/deepmodeling/dpti
  license: LGPL-3.0
  license_family: LGPL
  license_file: LICENSE
  doc_url: https://github.com/deepmodeling/dpti
  dev_url: https://github.com/deepmodeling/dpti

extra:
  recipe-maintainers:
    - felix5572
